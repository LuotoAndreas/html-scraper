<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PNG Card Viewer</title>
    <link rel="stylesheet" href="/static/cards_png.css">
</head>
<body>

<div class="card-grid">
    {% for card in cards %}
        <div class="card-item">
            <img src="/static/cards_png/{{ card.number }}.png" class="card-img">
            <div class="card-title">{{ card.title.title_text }}</div>
        </div>
    {% endfor %}
</div>

</body>
</html>
