<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terraforming Mars Card Showcase</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='corporations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='preludes.css') }}">
</head>

<body>
  <script>
    console.log("🔥 PAGE JS STARTED");
  </script>
  <script>
    console.log("🔥 LOCALSTORAGE RESTORE SCRIPT LOADED");

  </script>


  <h1>Card Showcase</h1>

  <!-- Top Buttons -->
  <div class="center-buttons">   
    

    <button id="play-music-btn">Play Music</button>

    <div class="select-wrapper">
      <label for="song-selector" class="song-label"></label>
      <select id="song-selector" aria-label="Choose song">
        <option value="{{ url_for('static', filename='AurelionSol.mp3') }}">Aurelion Sol</option>
        <option value="{{ url_for('static', filename='SuperGalaxyRumble.mp3') }}">Super Galaxy Rumble</option>
      </select>
    </div>
  </div>

  <h2 class="section-title">Selected Cards</h2>

  <!-- Selected Cards -->
  <div id="selected-cards-container"></div>

  <!-- Analyze Button -->
  <div class="center-buttons">
    <button id="random-hand-btn">🎲 Random Hand</button>
    <button id="analyze-btn">🔍 Analyze Deck</button>
  </div>

  <div class="center-buttons" style="margin-top:10px;">
    <button id="save-local-btn">💾 Save Deck Locally</button>
    <button id="load-local-btn">📥 Load Saved Deck</button>
    <button id="delete-local-btn">🗑️ Delete Saved Deck</button>
</div>

  <!-- AI Response -->
  <div id="ai-response"></div>

  <!-- Card Type Toggle Buttons -->
  <div class="toggle-buttons-wrapper">
    <button id="show-projects-btn" class="toggle-btn active">🃏 Project Cards</button>
    <button id="show-corps-btn" class="toggle-btn">🏢 Corporations</button>
    <button id="show-preludes-btn" class="toggle-btn">🌅 Preludes</button>
  </div>

  <!-- Search -->
  <div id="search-wrapper">
    <input type="text" id="card-search" placeholder="Search card name...">
  </div>

  <!-- Cards Container -->
  <div id="cards-container">
    {% for card in cards %}
      {% include "_card.html" %}
    {% endfor %}
  </div>

  {% include "_corporations.html" %}
  {% include "_preludes.html" %}

  <div id="error-message"></div>

  <video id="background-video" autoplay muted loop>
    <source src="{{ url_for('static', filename='background_animated.mp4') }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <audio id="background-audio" src="{{ url_for('static', filename='AurelionSol.mp3') }}" autoplay loop muted></audio>

  <!-- 🎵 MUSIC LOGIC -->
  <script>
    console.log("🔥 MUSIC SCRIPT STARTED");
    const audio = document.getElementById('background-audio');
    const video = document.getElementById('background-video');
    const playBtn = document.getElementById('play-music-btn');
    const songSelector = document.getElementById('song-selector');
    let isPlaying = false;

    video.pause();
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        video.pause();
        playBtn.textContent = 'Play Music';
      } else {
        audio.muted = false;
        audio.volume = 0.1;
        audio.play();
        video.play();
        playBtn.textContent = 'Pause Music';
      }
      isPlaying = !isPlaying;
    });

    songSelector.addEventListener('change', () => {
      const selectedSong = songSelector.value;
      const wasPlaying = isPlaying;
      audio.src = selectedSong;
      audio.load();
      if (wasPlaying) audio.play(); else audio.pause();
    });
  </script>

  <!-- 🔍 CARD SEARCH -->
  <script>
    console.log("🔥 SEARCH SCRIPT STARTED");
    document.getElementById('card-search').addEventListener('input', function () {
      const search = this.value.trim().toLowerCase();
      const cardsVisible = document.getElementById('cards-container').style.display !== 'none';
      const corpsVisible = document.getElementById('corporations-container').style.display !== 'none';
      const preludesVisible = document.getElementById('preludes-container').style.display !== 'none';

      if (cardsVisible) {
        document.querySelectorAll('#cards-container .card-wrapper').forEach(card => {
          const title = card.querySelector('.title')?.textContent.trim().toLowerCase() || '';
          const number = card.querySelector('.number')?.textContent.trim().toLowerCase() || '';
          card.style.display = (title.includes(search) || number.includes(search)) ? '' : 'none';
        });
      } 
      else if (corpsVisible) {
        document.querySelectorAll('#corporations-container .corporation-card').forEach(corp => {
          const name = corp.querySelector('.corp-name')?.textContent.trim().toLowerCase() || '';
          const id = corp.querySelector('.corp-id')?.textContent.trim().toLowerCase() || '';
          corp.style.display = (name.includes(search) || id.includes(search)) ? '' : 'none';
        });
      }
      else if (preludesVisible) {
        document.querySelectorAll('#preludes-container .prelude-card').forEach(prelude => {
          const name = prelude.querySelector('.prelude-name')?.textContent.trim().toLowerCase() || '';
          const id = prelude.querySelector('.prelude-number')?.textContent.trim().toLowerCase() || '';
          const tags = Array.from(prelude.querySelectorAll('.prelude-tag'))
            .map(t => t.textContent.trim().toLowerCase());
          const match = name.includes(search) || id.includes(search) || tags.some(t => t.includes(search));
          prelude.style.display = match ? '' : 'none';
        });
      }
    });
  </script>

  <!-- 🔄 TOGGLE PROJECT/CORPORATION/PRELUDE VIEW -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log("🔥 TOGGLE VIEW SCRIPT STARTED");
      const cardsContainer = document.getElementById('cards-container');
      const corporationsContainer = document.getElementById('corporations-container');
      const preludesContainer = document.getElementById('preludes-container');
      const showProjectsBtn = document.getElementById('show-projects-btn');
      const showCorpsBtn = document.getElementById('show-corps-btn');
      const showPreludesBtn = document.getElementById('show-preludes-btn');
      const searchInput = document.getElementById('card-search');

      corporationsContainer.style.display = 'none';
      preludesContainer.style.display = 'none';
      cardsContainer.style.display = '';

      function toggleSection(section) {
        cardsContainer.style.display = section === 'projects' ? '' : 'none';
        corporationsContainer.style.display = section === 'corps' ? 'flex' : 'none';
        preludesContainer.style.display = section === 'preludes' ? 'flex' : 'none';

        showProjectsBtn.classList.toggle('active', section === 'projects');
        showCorpsBtn.classList.toggle('active', section === 'corps');
        showPreludesBtn.classList.toggle('active', section === 'preludes');

        const placeholder = section === 'projects'
          ? 'Search project card name...'
          : section === 'corps'
          ? 'Search corporation name...'
          : 'Search prelude name...';
        searchInput.placeholder = placeholder;

        searchInput.value = '';
        document.querySelectorAll('.card-wrapper, .corporation-card, .prelude-card')
          .forEach(el => el.style.display = '');
      }

      showProjectsBtn.addEventListener('click', () => toggleSection('projects'));
      showCorpsBtn.addEventListener('click', () => toggleSection('corps'));
      showPreludesBtn.addEventListener('click', () => toggleSection('preludes'));
    });
  </script>

 

  <!-- 🧠 MAIN GAME LOGIC: SELECTION + ANALYSIS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log("🔥 ANALYZE / SELECTION SCRIPT STARTED");

      // ===============================
      // RESTORE DECK FROM LOCALSTORAGE
      // ===============================
      function restoreDeckUI(deck) {
        if (!deck) return;

        console.log("🔄 Applying saved deck to UI...", deck);

        //
        // 🃏 Restore project cards
        //
        (deck.card_ids || []).forEach(id => {
            const el = document.querySelector(`[data-card-number="${id}"]`);
            if (!el) return;

            // Ensure attributes exist
            el.dataset.cardNumber = el.dataset.cardNumber ||
                el.querySelector('.number')?.textContent.trim();

            addItem(el, "card");
        });

        //
        // 🏢 Restore corporations
        //
        (deck.corp_ids || []).forEach(id => {
            const el = document.querySelector(`[data-corp-id="${id}"]`);
            if (!el) return;

            // 🔧 FIX: ensure corpId attribute is attached before addItem()
            el.dataset.corpId = el.dataset.corpId ||
                el.querySelector('.corp-id')?.textContent.trim();

            addItem(el, "corporation");
        });

        //
        // 🌅 Restore preludes
        //
        (deck.prelude_ids || []).forEach(id => {
            const el = document.querySelector(`[data-prelude-id="${id}"]`);
            if (!el) return;

            // 🔧 FIX: ensure preludeId attribute is attached before addItem()
            el.dataset.preludeId = el.dataset.preludeId ||
                el.querySelector('.prelude-number')?.textContent.trim();

            addItem(el, "prelude");
        });
      }

      const searchInput = document.getElementById('card-search');
      const cardsContainer = document.getElementById('cards-container');
      const corporationsContainer = document.getElementById('corporations-container');
      const preludesContainer = document.getElementById('preludes-container');
      const selectedContainer = document.getElementById('selected-cards-container');

      const selectedItems = new Map();   // project cards
      const selectedCorps = new Map();   // corporations
      const selectedPreludes = new Map();// preludes
      const selectedCards = selectedItems;      

      // SAVE TO LOCALSTORAGE
      function saveCurrentDeck() {
        const deck = {
          card_ids: Array.from(selectedItems.keys()),
          corp_ids: Array.from(selectedCorps.keys()),
          prelude_ids: Array.from(selectedPreludes.keys())
        };
        localStorage.setItem("savedDeck", JSON.stringify(deck));
        console.log("💾 Deck saved to localStorage", deck);
      }

      // 🎴 Handle project card selection
      cardsContainer.addEventListener('click', (event) => {
        const cardWrapper = event.target.closest('.card-wrapper');
        if (!cardWrapper) return;
        addItem(cardWrapper, 'card');
      });

      // 🏢 Handle corporation selection
      corporationsContainer.addEventListener('click', (event) => {
        const corpWrapper = event.target.closest('.corporation-card');
        if (!corpWrapper) return;
        corpWrapper.dataset.corpId = corpWrapper.querySelector('.corp-id')?.textContent.trim() || '';
        addItem(corpWrapper, 'corporation');
      });

      // 🌅 Handle prelude selection
      preludesContainer.addEventListener('click', (event) => {
        const preludeWrapper = event.target.closest('.prelude-card');
        if (!preludeWrapper) return;
        preludeWrapper.dataset.preludeId = preludeWrapper.querySelector('.prelude-number')?.textContent.trim() || '';
        addItem(preludeWrapper, 'prelude');
      });

      // 🧩 Shared add function
      function addItem(itemWrapper, type) {
        const itemId = itemWrapper.dataset.cardNumber || itemWrapper.dataset.corpId || itemWrapper.dataset.preludeId || 'NOID';
        if (!itemId) return;

        const map =
          type === 'card' ? selectedItems :
          type === 'corporation' ? selectedCorps :
          selectedPreludes;

        if (map.has(itemId)) return;

        const clone = itemWrapper.cloneNode(true);
        clone.classList.add('selected-copy');
        clone.style.position = 'relative';
        clone.style.overflow = 'visible';
        clone.style.zIndex = '5';

        // ❌ Remove button
        const removeBtn = document.createElement('button');
        removeBtn.textContent = '❌';
        removeBtn.className = 'remove-selected-btn';
        removeBtn.style.cssText = `
          position: absolute;
          top: -14px;
          right: -14px;
          z-index: 9999;
          background: rgba(0,0,0,0.7);
          color: white;
          border: none;
          border-radius: 50%;
          width: 26px;
          height: 26px;
          cursor: pointer;
          font-size: 14px;
          line-height: 22px;
          display: flex;
          align-items: center;
          justify-content: center;
        `;

        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          clone.remove();
          map.delete(itemId);
          itemWrapper.classList.remove('selected');
          saveCurrentDeck();
        });

        clone.appendChild(removeBtn);
        selectedContainer.appendChild(clone);
        map.set(itemId, clone);
        itemWrapper.classList.add('selected');
        saveCurrentDeck();
      }

      // 🎲 Random Hand Generator Button
      const randomBtn = document.getElementById('random-hand-btn');
      if (randomBtn) {
        randomBtn.addEventListener('click', () => {
          const allCards = Array.from(cardsContainer.querySelectorAll('.card-wrapper'));
          const allCorps = Array.from(corporationsContainer.querySelectorAll('.corporation-card'));
          const allPreludes = Array.from(preludesContainer.querySelectorAll('.prelude-card'));

          function pickRandom(arr, n) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy.slice(0, Math.min(n, copy.length));
          }

          selectedContainer.innerHTML = '';
          selectedItems.clear();
          selectedCorps.clear();
          selectedPreludes.clear();
          document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));

          const chosenCards = pickRandom(allCards, 10);
          const chosenCorps = pickRandom(allCorps, 2);
          const chosenPreludes = pickRandom(allPreludes, 4);

          chosenCards.forEach(c => addItem(c, 'card'));
          chosenCorps.forEach(c => addItem(c, 'corporation'));
          chosenPreludes.forEach(p => addItem(p, 'prelude'));

          console.log('🎲 Randomized selection complete.');
        });
      }

      // 🧠 Analyze Deck button
      document.getElementById('analyze-btn').addEventListener('click', () => {
        const selectedData = {
          card_ids: Array.from(selectedItems.values()).map(c => c.dataset.cardNumber?.trim()).filter(Boolean),
          corp_ids: Array.from(selectedCorps.values()).map(c => c.dataset.corpId?.trim()).filter(Boolean),
          prelude_ids: Array.from(selectedPreludes.values()).map(p => p.dataset.preludeId?.trim()).filter(Boolean)
        };

        console.log('Sending deck data:', selectedData);

        const aiDiv = document.getElementById('ai-response');
        aiDiv.style.display = 'block';
        aiDiv.innerHTML = '🤖 <em>Analyzing deck...</em> please wait.';

        fetch('/save_deck', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(selectedData)
        })
        .then(res => res.json())
        .then(() => fetch('/analyze_deck', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(selectedData)
        }))
        .then(res => res.json())
        .then(result => {
          const aiDiv = document.getElementById('ai-response');
          aiDiv.scrollIntoView({ behavior: "smooth" });

          if (!result.analysis) {
            aiDiv.textContent = '⚠️ Error: ' + (result.error || 'Unknown issue');
            return;
          }

          let analysis = result.analysis;

          // 🧠 Try to parse JSON strings automatically (even if wrapped in ```json ... ```).
          if (typeof analysis === 'string') {
            let cleaned = analysis.trim();

            if (cleaned.startsWith("```")) {
              cleaned = cleaned.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
            }

            if (cleaned.startsWith("{") || cleaned.startsWith("[")) {
              try {
                analysis = JSON.parse(cleaned);
                console.log("✅ Parsed JSON from GPT response");
              } catch (err) {
                console.warn("⚠️ Failed to parse JSON string from GPT:", err, "\nContent:", cleaned);
              }
            }
          }

          console.log("🔍 BEFORE rendering — analysis typeof:", typeof analysis, analysis);

          // ✅ If backend returned structured JSON (object)
          if (typeof analysis === 'object') {
            const r = analysis.recommended_setup || {};
            const alt = analysis.alternatives || [];

            console.log("🔍 Full analysis object from backend:", analysis);
            console.log("🔍 recommended_setup.early_game_plan:", r.early_game_plan);

            // Helper: render card visually if it exists on page
            const renderSelectedCardByTitle = (names) => {
            if (!Array.isArray(names)) names = [names];

            return names
              .filter(name => typeof name === "string" && name.trim())
              .map(name => {
                const lowerName = name.trim().toLowerCase();

                // Search ANY card on the page — NOT just selected ones
                let match = Array.from(document.querySelectorAll('.card-wrapper, .corporation-card, .prelude-card'))
                  .find(c => {
                    const label = c.querySelector('.title, .corp-name, .prelude-name')?.textContent?.trim()?.toLowerCase() || "";
                    return label === lowerName;
                  });

                // Try matching by number
                if (!match) {
                  match = Array.from(document.querySelectorAll('.card-wrapper, .corporation-card, .prelude-card'))
                    .find(c => {
                      const num = (c.dataset.cardNumber || c.dataset.corpId || c.dataset.preludeId || "")
                        .trim().toLowerCase();
                      return num === lowerName;
                    });
                }

                if (match) {
                  const clone = match.cloneNode(true);
                  clone.style.cursor = "default";
                  clone.querySelectorAll('button').forEach(b => b.remove());
                  return clone.outerHTML;
                } else {
                  return `<div class="ai-pill">${name}</div>`;
                }
              })
              .join("");
          };


            let html = `
              <h2 class="ai-title">🏢 Recommended Setup</h2>
              <div class="ai-cards-section">

                <h3 class="ai-subtitle">Corporation and Preludes</h3>
                <div class="ai-flex">
                  ${renderSelectedCardByTitle([r.corporation].filter(Boolean))}, ${renderSelectedCardByTitle(r.preludes || [])}
                </div>

                <h3 class="ai-subtitle">🃏 Project Cards</h3>
                <div class="ai-flex center">
                  ${renderSelectedCardByTitle(r.kept_projects || [])}
                </div>

                <p class="ai-rating"><strong>⭐ Synergy Rating:</strong> ${r.synergy_rating || "?"}/10</p>

                <!-- STRICT SYNERGY REPORT (Grouped) -->
                <h3 class="ai-subtitle">🔗 Mechanical Synergies</h3>

                ${
                  (() => {
                    const groups = r.synergy_report?.synergy_groups || {};
                    const keys = Object.keys(groups);

                    if (keys.length === 0) {
                      return "<div class='ai-pill'>No mechanical synergies detected.</div>";
                    }

                    return keys.map(groupName => `
                      <div class="ai-synergy-group">
                        <h4 class="ai-synergy-group-title">${groupName}</h4>
                        <div class="ai-synergies">
                          ${groups[groupName]
                            .map(line => `<div class="ai-pill synergy">${line}</div>`)
                            .join("")}
                        </div>
                      </div>
                    `).join("");
                  })()
                }

                <!-- GENERAL REASONING (not synergy-specific) -->
                ${Array.isArray(r.reasoning) ? 
                  `<h3 class="ai-subtitle">📘 Reasoning</h3>
                  <ul class="ai-reason-list">
                    ${r.reasoning.map(line => `<li>${line}</li>`).join("")}
                  </ul>` 
                  : ""}

                  ${r.early_game_plan
                    ? `<h3 class="ai-subtitle">🕹️ Early Game Plan</h3><p>${r.early_game_plan}</p>`
                    : ""}
              </div>
            `;

            if (alt.length) {
              html += `
                <h2 class="ai-title">🔁 Alternative Combo</h2>
                ${alt.map(a => `
                <div class="ai-cards-section">

                  <h3 class="ai-subtitle">Corporation and Preludes</h3>
                  <div class="ai-flex">
                    ${renderSelectedCardByTitle([a.corporation])}, ${renderSelectedCardByTitle(a.preludes || [])}
                  </div>

                  <h3 class="ai-subtitle">🃏 Project Cards</h3>
                  <div class="ai-flex center">
                    ${renderSelectedCardByTitle(a.kept_projects || [])}
                  </div>

                  <p class="ai-rating"><strong>⭐ Rating:</strong> ${a.synergy_rating || "?"}/10</p>

                  <!-- STRICT SYNERGY REPORT (Grouped) -->
                  <h3 class="ai-subtitle">🔗 Mechanical Synergies</h3>

                  ${
                    (() => {
                      const groups = a.synergy_report?.synergy_groups || {};
                      const keys = Object.keys(groups);

                      if (keys.length === 0) {
                        return "<div class='ai-pill'>No mechanical synergies detected.</div>";
                      }

                      return keys.map(groupName => `
                        <div class="ai-synergy-group">
                          <h4 class="ai-synergy-group-title">${groupName}</h4>
                          <div class="ai-synergies">
                            ${groups[groupName]
                              .map(line => `<div class="ai-pill synergy">${line}</div>`)
                              .join("")}
                          </div>
                        </div>
                      `).join("");
                    })()
                  }


                  <!-- GENERAL REASONING -->
                  ${Array.isArray(a.reasoning) ? 
                    `<h3 class="ai-subtitle">📘 Reasoning</h3>
                    <ul class="ai-reason-list">
                      ${a.reasoning.map(line => `<li>${line}</li>`).join("")}
                    </ul>` 
                    : ""}

                    ${a.early_game_plan
                      ? `<h3 class="ai-subtitle">🕹️ Early Game Plan</h3><p>${a.early_game_plan}</p>`
                      : ""}
                </div>
              `).join("")}
              `;
            }

            aiDiv.innerHTML = html;
          }
          // ✅ If backend returned plain text (mock mode or fallback)
          else {
            aiDiv.textContent = analysis;
          }
        })
        .catch(err => {
          console.error('❌ Failed to get AI analysis:', err);
          aiDiv.textContent = '❌ Failed to get AI analysis: ' + err;
        });
      });

      // ===============================
      // LOCAL DECK SAVE / LOAD BUTTONS
      // ===============================
      document.getElementById("save-local-btn").addEventListener("click", () => {
          const deck = {
              card_ids: Array.from(selectedItems.keys()),
              corp_ids: Array.from(selectedCorps.keys()),
              prelude_ids: Array.from(selectedPreludes.keys())
          };

          localStorage.setItem("savedDeckManual", JSON.stringify(deck));
          console.log("💾 Saved manually to savedDeckManual:", deck);
          alert("Deck saved locally!");
      });

      document.getElementById("load-local-btn").addEventListener("click", () => {
          const saved = localStorage.getItem("savedDeckManual");
          if (!saved) {
              alert("No saved deck found!");
              return;
          }

          const deck = JSON.parse(saved);
          console.log("📥 Loading saved deck:", deck);

          // Clear current selections
          selectedContainer.innerHTML = '';
          selectedItems.clear();
          selectedCorps.clear();
          selectedPreludes.clear();
          document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));

          // Restore saved deck to UI
          restoreDeckUI(deck);

          // Persist as "current working deck"
          localStorage.setItem("savedDeck", saved);

          alert("Saved deck loaded!");
      });

      document.getElementById("delete-local-btn").addEventListener("click", () => {
          localStorage.removeItem("savedDeckManual");
          alert("Saved deck deleted!");
      });
    }); 
  </script>


  <script src="{{ url_for('static', filename='js/card_customizations.js') }}"></script>

</body>
</html>
